<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  
  <?!= include('CSS'); ?>
</head>
<body>

<datalist id="customerList"></datalist>
<datalist id="companyList"></datalist>
<datalist id="csDataList"></datalist> 
<datalist id="agentDataList"></datalist> 
<datalist id="loadPlaceList"></datalist>
<datalist id="cyPlaceList"></datalist>
<datalist id="rtnPlaceList"></datalist> 

<datalist id="typeList"><option value="20'"><option value="40'"><option value="40HQ"></datalist>
<datalist id="fuelRuleList"><option value="1"><option value="15"><option value="เฉลี่ยเดือน"><option value="เฉลี่ยครึ่ง"></datalist>

<div id="loginSection" class="login-wrapper" style="display: none;">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card login-card p-4 p-md-5 text-center fade-in-up">
      <div class="truck-icon-wrapper mb-4 mx-auto">
        <span class="truck-emoji">🚛</span>
      </div>
      <h3 class="mb-1 fw-bold text-gradient">Booking System</h3>
      <p class="text-muted mb-4 small">ระบบจัดการการจองรถขนส่ง</p>

      <div class="input-group mb-4 login-input-group shadow-sm">
        <span class="input-group-text bg-transparent border-end-0 ps-4">
            <i class="bi bi-key-fill text-primary"></i>
        </span>
        <input type="password" id="loginPassword" class="form-control form-control-lg border-start-0 shadow-none text-center" placeholder="กรอกรหัสผ่าน..." onkeypress="if(event.key === 'Enter') doLogin()">
      </div>
      <button class="btn btn-gradient btn-lg w-100 fw-bold rounded-pill btn-login-animate shadow" onclick="doLogin()" id="btnLogin">
        <span><i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ</span>
      </button>
    </div>
  </div>
</div>

<div id="mainApp" class="container-fluid slide-up">
  
  <div class="d-flex flex-column flex-xl-row justify-content-between align-items-xl-center mb-3 mt-2 gap-3">
    
    <div class="d-flex align-items-center justify-content-between w-100 w-xl-auto">
      <div class="d-flex align-items-center gap-2">
        <h3 class="fw-bold m-0" style="color: #1e293b; white-space: nowrap;"><i class="bi bi-bar-chart-fill text-primary"></i> Data Dashboard</h3>
      </div>
      <span class="badge bg-white text-secondary border px-3 py-2 rounded-pill shadow-sm d-flex align-items-center fs-6">
        <i class="bi bi-person-circle text-primary me-2"></i> <strong id="displayUser" class="text-primary"></strong>
      </span>
    </div>

    <div class="row g-2 w-100 w-xl-auto my-1 my-xl-0 flex-grow-1 justify-content-xl-center">
      <div class="col-6 col-xl-auto">
        <div class="compact-card bg-gradient-total shadow-sm h-100 w-100" onclick="showCSBreakdown('total')" title="ตู้ทั้งหมด">
            <div class="card-icon"><i class="bi bi-box-seam"></i></div>
            <div class="card-info">
                <span class="card-label">ตู้ทั้งหมด</span>
                <span class="card-value" id="sumTotal">0</span>
            </div>
        </div>
      </div>
      <div class="col-6 col-xl-auto">
        <div class="compact-card bg-gradient-pending shadow-sm h-100 w-100" onclick="showCSBreakdown('pending')" title="รอจัดรถ">
            <div class="card-icon"><i class="bi bi-clock-history"></i></div>
            <div class="card-info">
                <span class="card-label">รอจัดรถ</span>
                <span class="card-value" id="sumPending">0</span>
            </div>
        </div>
      </div>
      <div class="col-6 col-xl-auto">
        <div class="compact-card bg-gradient-done shadow-sm h-100 w-100" onclick="showCSBreakdown('done')" title="จัดรถแล้ว (กำลังวิ่งงาน)">
            <div class="card-icon"><i class="bi bi-truck"></i></div>
            <div class="card-info">
                <span class="card-label">จัดรถแล้ว</span>
                <span class="card-value" id="sumDone">0</span>
            </div>
        </div>
      </div>
      <div class="col-6 col-xl-auto">
        <div class="compact-card bg-gradient-finished shadow-sm h-100 w-100" onclick="showCSBreakdown('finished')" title="จบงานพร้อมส่งบัญชี">
            <div class="card-icon"><i class="bi bi-check2-all"></i></div>
            <div class="card-info">
                <span class="card-label">จบงานรอวางบิล</span>
                <span class="card-value" id="sumFinished">0</span>
            </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap justify-content-between justify-content-xl-end align-items-center gap-2 w-100 w-xl-auto">
      <div class="dropdown flex-grow-1 flex-xl-grow-0">
        <button class="btn btn-light bg-white border shadow-sm rounded-pill fw-bold px-3 py-2 w-100 btn-add-action" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-grid-fill text-secondary me-1"></i> เมนูจัดการ
        </button>
        <ul class="dropdown-menu shadow-lg border-0 mt-2 w-100" style="border-radius: 12px; min-width: 220px;">
          <li><a class="dropdown-item py-2 fw-bold text-success" href="javascript:void(0)" onclick="openBatchTruckModal()"><i class="bi bi-truck me-2"></i> จัดการรถ (Batch)</a></li>
          <li><a class="dropdown-item py-2 fw-bold text-warning" href="javascript:void(0)" onclick="openPricingMasterModal()"><i class="bi bi-cash-coin me-2"></i> จัดการราคา / น้ำมัน</a></li>
          <li><a class="dropdown-item py-2 fw-bold text-primary" href="javascript:void(0)" onclick="openCustomerModal()"><i class="bi bi-people-fill me-2"></i> จัดการลูกค้า</a></li>
          <li><a class="dropdown-item py-2 fw-bold text-info" href="javascript:void(0)" onclick="openLogModal()"><i class="bi bi-clock-history me-2"></i> ประวัติการทำงาน</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item py-2 fw-bold text-success" href="javascript:void(0)" onclick="exportToExcel()"><i class="bi bi-file-earmark-excel-fill me-2"></i> โหลดไฟล์ Excel</a></li>
          <li><a class="dropdown-item py-2 fw-bold text-danger" href="javascript:void(0)" onclick="openDeleteBookingModal()"><i class="bi bi-trash-fill me-2"></i> ลบ Booking</a></li>
        </ul>
      </div>

      <button class="btn btn-booking-pulse rounded-pill px-4 py-2 shadow-lg fw-bold btn-add-action flex-grow-1 flex-xl-grow-0" data-bs-toggle="modal" data-bs-target="#addModal" onclick="clearForm()">
        <i class="bi bi-plus-circle-fill fs-6 me-1"></i> เพิ่ม Booking
      </button>

      <div class="d-flex gap-2">
        <button class="btn btn-light rounded-circle shadow-sm btn-add-action icon-btn border" onclick="loadData(); loadCustomerList(); loadPricingData();" title="รีเฟรชข้อมูล">
          <i class="bi bi-arrow-clockwise text-secondary"></i>
        </button>
        <button class="btn btn-light rounded-circle shadow-sm btn-add-action icon-btn border border-danger text-danger" onclick="logout()" title="ออกจากระบบ">
          <i class="bi bi-power"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="card p-3 p-md-4 mb-4">
    <div class="row g-2 mb-3 border-bottom pb-3 align-items-end">
      <div class="col-12 col-md-2">
        <label class="small text-muted mb-1">ค้นหาทั่วไป</label>
        <input type="text" id="filterText" class="form-control form-control-sm" placeholder="พิมพ์เพื่อค้นหา..." onkeyup="applyFilters()">
      </div>
      <div class="col-6 col-md-1">
        <label class="small text-muted mb-1">CS</label>
        <input type="text" id="filterCS" list="csDataList" class="form-control form-control-sm" placeholder="พิมพ์ชื่อ..." onkeyup="applyFilters()" onchange="applyFilters()">
      </div>
      
      <div class="col-6 col-md-2">
        <label class="small text-muted mb-1">สถานะ</label>
        <select id="filterStatus" class="form-select form-select-sm" onchange="applyFilters()">
          <option value="">- ทุกสถานะ -</option>
          <option value="รอจัดรถ">รอจัดรถ</option>
          <option value="กำลังไปรับตู้">กำลังไปรับตู้</option>
          <option value="ดรอปตู้ (รอบรรจุ)">ดรอปตู้ (รอบรรจุ)</option>
          <option value="กำลังบรรจุ/เปิดตู้">กำลังบรรจุ/เปิดตู้</option>
          <option value="ดรอปตู้ (รอคืน)">ดรอปตู้ (รอคืน)</option>
          <option value="กำลังไปคืนตู้">กำลังไปคืนตู้</option>
          <option value="คืนตู้แล้ว">คืนตู้แล้ว</option>
          <option value="จบงานรอวางบิล">จบงานรอวางบิล</option>
          <option value="พร้อมวางบิล">พร้อมวางบิล</option>
          <option value="วางบิลแล้ว">วางบิลแล้ว</option>
        </select>
      </div>

      <div class="col-12 col-md-2">
        <label class="small text-muted mb-1">Mode</label>
        <select id="filterMode" class="form-select form-select-sm" onchange="applyFilters()">
          <option value="">- ทุก Mode -</option>
          <option value="BKK">BKK (กรุงเทพ)</option>
          <option value="LCB">LCB (แหลมฉบัง)</option>
          <option value="Export/BKK">Export/BKK (ส่งออก/กรุงเทพ)</option>
          <option value="Export/LCB">Export/LCB (ส่งออก/แหลมฉบัง)</option>
          <option value="Import/BKK">Import/BKK (นำเข้า/กรุงเทพ)</option>
          <option value="Import/LCB">Import/LCB (นำเข้า/แหลมฉบัง)</option>
        </select>
      </div>
      <div class="col-4 col-md-1">
        <label class="small text-muted mb-1">ปี</label>
        <select id="filterYear" class="form-select form-select-sm" onchange="applyFilters()">
          <option value="">- ทุกปี -</option>
          <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option>
        </select>
      </div>
      <div class="col-4 col-md-1">
        <label class="small text-muted mb-1">เดือน</label>
        <select id="filterMonth" class="form-select form-select-sm" onchange="applyFilters()">
          <option value="">- ทุกเดือน -</option>
          <option value="01">ม.ค.</option><option value="02">ก.พ.</option><option value="03">มี.ค.</option>
          <option value="04">เม.ย.</option><option value="05">พ.ค.</option><option value="06">มิ.ย.</option>
          <option value="07">ก.ค.</option><option value="08">ส.ค.</option><option value="09">ก.ย.</option>
          <option value="10">ต.ค.</option><option value="11">พ.ย.</option><option value="12">ธ.ค.</option>
        </select>
      </div>
      <div class="col-4 col-md-1">
        <label class="small text-muted mb-1">วันที่</label>
        <select id="filterDay" class="form-select form-select-sm" onchange="applyFilters()">
          <option value="">- วัน -</option>
          <script>
            for(let i=1; i<=31; i++) { let d = i<10 ? '0'+i : i; document.write(`<option value="${d}">${d}</option>`); }
          </script>
        </select>
      </div>
      <div class="col-6 col-md-1">
        <label class="small text-muted mb-1">แสดงผล</label>
        <select id="pageSize" class="form-select form-select-sm" onchange="currentPage=1; applyFilters()">
          <option value="30">30 ราย</option>
          <option value="50" selected>50 ราย</option>
          <option value="80">80 ราย</option>
          <option value="100">100 ราย</option>
          <option value="all">ทั้งหมด</option>
        </select>
      </div>
      <div class="col-6 col-md-auto mt-2 mt-md-0 ms-md-auto">
        <button class="btn btn-light btn-sm border text-secondary shadow-sm px-3 w-100 py-2 py-md-1" onclick="clearFilters()">
            <i class="bi bi-arrow-counterclockwise"></i> ล้างกรอง
        </button>
      </div>
    </div>

    <div class="table-responsive table-container shadow-sm bg-white mb-3">
      <table class="table table-bordered table-hover text-nowrap mb-0 table-sm" id="dataTable" style="font-size: 12.5px;">
        <thead class="table-dark sticky-top" id="tableHead" style="z-index: 10;"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3" id="paginationControls" style="display:none !important;">
        <span class="small text-muted fw-bold" id="pageInfo">แสดงหน้า 1 จาก 1</span>
        <div class="btn-group btn-group-sm shadow-sm w-100 w-md-auto">
            <button class="btn btn-outline-secondary" onclick="changePage(-1)"><i class="bi bi-chevron-left"></i> ก่อนหน้า</button>
            <button class="btn btn-outline-secondary" onclick="changePage(1)">ถัดไป <i class="bi bi-chevron-right"></i></button>
        </div>
    </div>
  </div>
</div>

<?!= include('Modals'); ?>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<?!= include('JS'); ?>

</body>
</html>
